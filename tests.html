<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartIPA tests</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="narrow">
  <div class="page-head"><h1>SmartIPA tests</h1><p class="hint" id="score">Running…</p></div>
  <section class="card">
    <div class="scroll-x">
      <table class="table">
        <thead><tr><th>Test</th><th>Expected</th><th>Got</th><th>Result</th></tr></thead>
        <tbody id="tests"></tbody>
      </table>
    </div>
  </section>
  <section class="card">
    <h2>Vocal tract gallery</h2>
    <p class="hint">Every chart sound, for checking the drawings by eye.</p>
    <div id="gallery" class="gallery"></div>
  </section>
</main>
<style>
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
  .gallery figure { margin: 0; }
  .gallery figcaption { font-size: 12px; margin-top: 4px; }
</style>
<script src="js/core.js"></script>
<script src="js/data/sounds.js"></script>
<script src="js/data/marks.js"></script>
<script src="js/data/dia-audio.js"></script>
<script src="js/tract.js"></script>
<script src="data/cmudict.js"></script>
<script src="src/english-to-ipa.js"></script>
<script src="js/palette.js"></script>
<script>
(function () {
  var T = function (s, o) { return SmartIPA.transcribe(s, o); };
  var S = window.SIPA;
  var cases = [
    ['hello', T('hello'), '/həˈlow/'],
    ['water: AO is /ɑ/ unless before r', T('water'), '/ˈwɑtɚ/'],
    ['about', T('about'), '/əˈbawt/'],
    ['class diphthong /aj/', T('buy'), '/baj/'],
    ['class diphthong /ɔj/', T('boy'), '/bɔj/'],
    ['class diphthong /aw/', T('how'), '/haw/'],
    ['class diphthong /ej/', T('date'), '/dejt/'],
    ['class diphthong /ow/', T('hope'), '/howp/'],
    ['dog uses /ɑ/', T('dog'), '/dɑɡ/'],
    ['four keeps /ɔ/ before r', T('four'), '/fɔɹ/'],
    ['stressed /ʌ/, unstressed /ə/', T('buck sofa'), '/bʌk ˈsowfə/'],
    ['aspiration and flap', T('potato', { phonetic: true }), '/pʰəˈtʰejɾow/'],
    ['flap in butter', T('butter', { phonetic: true }), '/ˈbʌɾɚ/'],
    ['no aspiration after s', T('spin pin skin cat', { phonetic: true }), '/spɪn pʰɪn skɪn kʰæt/'],
    ['canyon', T('canyon'), '/ˈkænjən/'],
    ['the cat', T('the cat'), '/ðə kæt/'],
    ['strength', T('strength'), '/stɹɛŋkθ/'],
    ['understand', T('understand'), '/ˌʌndɚˈstænd/'],
    ['international', T('international'), '/ˌɪntɚˈnæʃənəl/'],
    ['extra', T('extra'), '/ˈɛkstɹə/'],
    ['bird', T('bird'), '/bɝd/'],
    ['punctuation kept', T('Thinking, she judged.'), '/ˈθɪŋkɪŋ, ʃi dʒʌdʒd./'],
    ['possessives and plurals', T("cat's dogs' boxes"), '/kæts dɑɡz ˈbɑksəz/'],
    ['quotes dropped', T('“Don’t stop,” he said'), '/downt stɑp, hi sɛd/'],
    ['number', T('42'), '/ˈfɔɹti tu/'],
    ['heteronym, first listed', T('record'), '/ɹəˈkɔɹd/'],
    ['guess for unknown word', T('blorfing'), '/blɔɹfɪŋ/'],
    ['r is always ɹ', T('red car'), '/ɹɛd kɑɹ/'],
    ['no stress, no slashes', T('international', { stress: false, slashes: false }), 'ɪntɚnæʃənəl'],
    ['aspiration allowed on p', S.diacritics.reason('asp', S.sounds.by.p, {}), ''],
    ['aspiration banned on b', S.diacritics.reason('asp', S.sounds.by.b, {}), 'Only on voiceless consonants'],
    ['aspiration banned on s', S.diacritics.reason('asp', S.sounds.by.s, {}), 'Only on stops, affricates and clicks'],
    ['voiceless banned on p', S.diacritics.reason('vl', S.sounds.by.p, {}), 'Already voiceless'],
    ['breathy needs voicing', S.diacritics.reason('br', S.sounds.by.t, {}), 'Needs a voiced sound'],
    ['breathy fine once voiced', S.diacritics.reason('br', S.sounds.by.t, { vd: true }), ''],
    ['nasalized banned on plosives', S.diacritics.reason('nas', S.sounds.by.t, {}), 'Only on vowels, approximants, liquids and clicks'],
    ['nasalized banned on nasals', S.diacritics.reason('nas', S.sounds.by.m, {}), 'Already nasal'],
    ['palatalized banned on palatals', S.diacritics.reason('pal', S.sounds.by.c, {}), 'Already palatal'],
    ['opposites conflict', S.diacritics.reason('ret', S.sounds.by.k, { adv: true }), 'Conflicts with Advanced'],
    ['syllabic only on sonorants', S.diacritics.reason('syl', S.sounds.by.t, {}), 'Only nasals, liquids and approximants can form a syllable'],
    ['raised blocked on closed vowel', S.diacritics.reason('rai', S.sounds.by.i, {}), 'Already as close as a vowel gets'],
    ['resolve keeps the first of two clashing marks and drops ones that cannot apply', Object.keys(S.diacritics.resolve({ asp: true, vd: true, nas: true }, S.sounds.by.p)).join(','), 'vd'],
    ['recording for n̥', String(!!S.diacriticAudio('n', ['vl'])), 'true'],
    ['recording for pʰ', String(!!S.diacriticAudio('p', ['asp'])), 'true'],
    ['recording for ɔ̃', String(!!S.diacriticAudio('ɔ', ['nas'])), 'true'],
    ['121 chart sounds', String(S.sounds.all.length), '121'],
    ['every sound has a recording', String(S.sounds.all.filter(function (o) { return o.audio; }).length), '121'],
    ['every sound has an example', String(S.sounds.all.filter(function (o) { return o.ex; }).length), '121'],
    ['every sound draws a tract', String(S.sounds.all.filter(function (o) { return /^<svg[\s\S]*<\/svg>$/.test(S.tractSVG(S.tractParams(o))) && !/NaN|undefined/.test(S.tractSVG(S.tractParams(o))); }).length), '121'],
    ['31 diacritics', String(S.diacritics.list.length), '31'],
    ['every diacritic has a family and a scope', String(S.diacritics.list.filter(function (x) { return x.family && x.applies; }).length), '31'],
    ['every chart sound accepts at least one diacritic', String(S.sounds.all.filter(function (o) { return S.diacritics.list.some(function (x) { return !S.diacritics.reason(x.id, o, {}); }); }).length), '121'],
    ['24 prosody marks', String(S.prosody.items.length), '24'],
    ['every animated tract morphs between same-shaped paths', String(S.sounds.all.filter(function (o) {
      var svg = S.tractSVG(S.tractParams(o), { animate: true }), ok = /<animate /.test(svg);
      svg.replace(/values="([^"]*)"/g, function (m, v) {
        if (/^[\d.;\s]+$/.test(v)) return m;
        var shapes = v.split(';').map(function (d) { return d.replace(/-?\d*\.?\d+(e-?\d+)?/g, '#').replace(/\s+/g, ' ').trim(); });
        if (shapes.some(function (x) { return x !== shapes[0]; })) ok = false;
        return m;
      });
      return ok;
    }).length), '121'],
    ['search: X-SAMPA S finds ʃ', S.palette.search('S')[0].sym, 'ʃ'],
    ['search: "velar" lists k first', S.palette.search('velar')[0].sym, 'k'],
    ['search: "sh" finds ʃ', S.palette.search('sh')[0].sym, 'ʃ'],
    ['search: "aspirated t" offers tʰ', S.palette.search('aspirated t')[0].sym, 'tʰ'],
    ['search: "voiceless n" offers n̥', S.palette.search('voiceless n')[0].sym, 'n̥'],
    ['textbook style diphthongs', T('buy boy how date hope', { stress: false, style: 'textbook' }), '/baɪ bɔɪ haʊ deɪt hoʊp/'],
    ['textbook style: thought and dog have ɔ', T('thought dog four', { stress: false, style: 'textbook' }), '/θɔt dɔɡ fɔɹ/'],
    ['class style unchanged by default', T('buy dog', { stress: false }), '/baj dɑɡ/'],
    ['textbook style also applies to guesses', SmartIPA.wordToIPA('blighzome', { style: 'textbook' }).ipa.indexOf('aj') < 0 ? 'no aj' : 'has aj', 'no aj'],
    ['compare drawing marks B where it differs', String((S.tractCompareSVG(S.tractParams(S.sounds.by.p), S.tractParams(S.sounds.by.b)).match(/ cmp"/g) || []).length > 0), 'true'],
    ['compare drawing of a sound with itself has no B lines', String((S.tractCompareSVG(S.tractParams(S.sounds.by.p), S.tractParams(S.sounds.by.p)).match(/ cmp"/g) || []).length), '0'],
    ['search: "p vs b" offers a comparison', S.palette.search('p vs b')[0].href, '#/sounds/p?vs=b'],
    ['search always offers Transcribe', S.palette.search('zzzq').slice(-1)[0].action, 'transcribe']
  ];
  var pass = 0, body = document.getElementById('tests');
  cases.forEach(function (c) {
    var ok = c[1] === c[2];
    if (ok) pass++;
    var tr = document.createElement('tr');
    [c[0], c[2], c[1], ok ? 'pass' : 'FAIL'].forEach(function (v, i) {
      var td = document.createElement('td'); td.textContent = v;
      if (i === 1 || i === 2) td.className = 'ipa';
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  document.getElementById('score').textContent = pass + ' of ' + cases.length + ' pass';
  window.__testSummary = { pass: pass, total: cases.length };
  document.getElementById('gallery').innerHTML = S.sounds.all.map(function (o) {
    return '<figure>' + S.tractSVG(S.tractParams(o)) + '<figcaption><span class="ipa">' + S.esc(o.s) + '</span> ' + S.esc(o.name) + '</figcaption></figure>';
  }).join('');
})();
</script>
</body>
</html>
